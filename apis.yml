aid: storedot
name: StoreDot
description: 'StoreDot is an Israeli battery technology company founded in 2012 by
  Doron Myersdorf, Simon Litsyn and Gil Rosenman, headquartered in Herzliya with an
  advanced technology campus in Irvine, California. It develops extreme fast charging
  (XFC) lithium-ion cells built on proprietary silicon-dominant anode chemistry and
  synthesized organic and inorganic compounds optimized with machine-learning models,
  targeting the range and charging anxiety that gate mainstream electric-vehicle adoption.
  Its "100inX" product roadmap sets 100 miles of range charged in 5 minutes (100in5,
  2024), 3 minutes (100in3, 2028) and 2 minutes (100in2, 2032); the company has demonstrated
  pouch and prismatic XFC cells sustaining more than 1,000 and later 2,000 extreme
  fast charging cycles while retaining over 80 percent of original capacity, and designs
  its chemistry to drop into existing Li-ion production lines. Strategic investors
  and partners include Daimler/Mercedes-Benz, BP, VinFast, Volvo, Polestar, Ola Electric,
  Samsung Ventures, TDK and manufacturing partner EVE Energy. In 2026 a planned SPAC
  merger with Andretti Acquisition Corp. II was terminated and the company returned
  to private fundraising. StoreDot is a hardware, materials and cell-manufacturing
  business: it publishes no public developer API, SDK, MCP server or machine-readable
  API contract, and no /.well-known/ discovery surface, llms.txt or developer subdomain
  resolves on store-dot.com.'
